<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lists 3.0"><link rel="apple-touch-icon" href="icon.PNG"><link rel="icon" type="image/png" href="icon.PNG"><title>Lists 3.0</title><style>
:root{--bg:#d6d6d6;--surface:#f4f4f4;--surface2:#e9e9e9;--text:#202124;--muted:#666;--border:#bdbdbd;--accent:#e3e3e3;--strong:#666;--danger:#d93025}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.screen{display:none;min-height:100vh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.screen.active{display:flex;flex-direction:column}.main-screen{align-items:center}.main-title{margin:56px 0 34px;font-size:30px;text-align:center}.main-buttons{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}.main-btn{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:18px;color:var(--text);font-size:18px;font-weight:600}.theme-wrap{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px}.theme-button{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:8px 12px;color:#111;font-weight:600}.theme-menu{position:absolute;right:0;top:44px;width:292px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px #0002;z-index:20;display:none}.theme-menu.open{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.theme-option{min-height:88px;border:1px solid var(--border);background:transparent;padding:8px;border-radius:12px;color:var(--text)}.theme-option.selected{background:var(--accent);outline:2px solid var(--strong)}.swatches{display:flex;gap:4px;justify-content:center}.swatch{width:54px;height:28px;border-radius:7px;border:1px solid #0002}.theme-name{display:block;margin-top:7px;font-size:13px;font-weight:600}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between}.topbar-left,.topbar-right{width:120px;display:flex;gap:7px;align-items:center}.topbar-right{justify-content:flex-end}.topbar-center{font-size:19px;font-weight:700}.icon-btn,.text-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;min-width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center}.text-btn{padding:0 13px;font-size:15px;font-weight:600}.trash-btn{color:var(--danger)}.trash-svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.editor-body,.saved-body{width:min(760px,100%);margin:auto;flex:1}.list-name{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:13px 14px;outline:0;color:var(--text);font-size:18px;margin:12px 0 14px}.mode-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px}.mode-label{font-weight:650}.mode-help{font-size:12px;color:var(--muted)}.switch{position:relative;width:48px;height:28px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#999;border-radius:99px}.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--strong)}.switch input:checked+.slider:before{transform:translateX(20px)}.list-area{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}.task-row{display:grid;grid-template-columns:42px minmax(0,1fr) 38px;align-items:start;border-bottom:1px solid var(--border);padding:5px 8px}.task-row.no-check{grid-template-columns:42px minmax(0,1fr)}.number{padding:8px 4px;color:var(--muted);text-align:center;cursor:grab;user-select:none}.task-input{width:100%;min-height:32px;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;padding:7px 4px;resize:none;overflow:hidden;line-height:1.45;overflow-wrap:anywhere}.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;margin:5px auto}.check.checked{background:var(--strong);border-color:var(--strong);color:white}.task-row.no-check .check{display:none}.completed-title,.saved-section-title{font-size:15px;font-weight:700;color:var(--muted);margin:20px 3px 8px}.saved-list{display:flex;flex-direction:column;gap:10px}.saved-card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px}.saved-card.selected{outline:2px solid var(--strong);background:var(--surface2)}.saved-card.trashed{opacity:.55}.saved-main{flex:1;min-width:0}.saved-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-meta{font-size:12px;color:var(--muted);margin-top:3px}.selection-check{width:26px;height:26px;border:2px solid var(--muted);border-radius:50%;display:none;align-items:center;justify-content:center}.selection-check.on{display:flex;background:var(--strong);color:white}.selection-mode .selection-check{display:flex}.selection-trash{display:none!important}.selection-mode.has-selection .selection-trash{display:inline-flex!important}.saved-empty{text-align:center;color:var(--muted);padding:70px 20px}.modal-backdrop{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal-backdrop.open{display:flex}.modal{width:min(360px,100%);background:var(--surface);border-radius:18px;padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.danger-fill{background:var(--danger)!important;color:white!important}
</style></head><body><section id="main" class="screen main-screen active"><div class="theme-wrap"><button id="themeBtn" class="theme-button">Theme</button><div id="themeMenu" class="theme-menu"></div></div><h1 class="main-title">Lists 3.0</h1><div class="main-buttons"><button id="new" class="main-btn">Create New List</button><button id="saved" class="main-btn">Saved Lists</button></div></section>
<section id="savedScreen" class="screen"><div class="topbar"><div class="topbar-left"><button id="savedBack" class="icon-btn">‹</button></div><div class="topbar-center">Saved Lists</div><div class="topbar-right"><button id="select" class="text-btn">Select</button><button id="savedTrash" class="icon-btn trash-btn selection-trash"></button></div></div><div id="savedBox" class="saved-body"></div></section>
<section id="editor" class="screen"><div class="topbar"><div class="topbar-left"><button id="left" class="icon-btn">‹</button></div><div id="editorTitle" class="topbar-center">New List</div><div class="topbar-right"><button id="done" class="text-btn">Done</button><button id="editorTrash" class="icon-btn trash-btn" style="display:none"></button></div></div><div class="editor-body"><input id="name" class="list-name" placeholder="List name"><div class="mode-bar"><div><div class="mode-label">Checklist Mode</div><div class="mode-help">Turn on circles for completing items</div></div><label class="switch"><input id="toggle" type="checkbox"><span class="slider"></span></label></div><div class="list-area"><div id="active"></div></div><div id="completed" style="display:none"><div class="completed-title">Completed</div><div class="list-area"><div id="completeRows"></div></div></div></div></section>
<div id="modal" class="modal-backdrop"><div class="modal"><h3 id="mt"></h3><p id="mm"></p><div id="ma" class="modal-actions"></div></div></div>
<script>
const $=id=>document.getElementById(id),KEY='lists3-data-v1',TKEY='lists3-theme-v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),trash=()=>'<svg class="trash-svg" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M8 10v7M12 10v7M16 10v7M6.5 7l1 14h9l1-14"/></svg>';
let s={lists:[],id:null,fromSaved:false,select:false,selected:new Set()};try{s.lists=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};s.lists=s.lists.map(l=>({...l,id:l.id||uid(),tasks:(l.tasks||[]).map(t=>({...t,id:t.id||uid()}))}));
const themes={light:['#d6d6d6','#f4f4f4','#e9e9e9','#202124','#666','#bdbdbd','#e3e3e3','#666'],red:['#d9b5b5','#f2d7d7','#e7c7c7','#321919','#704f4f','#c99f9f','#e8caca','#a83f3f'],orange:['#dcc3a2','#f1dfc6','#e7d1b1','#352719','#735b43','#c8a982','#ead4b6','#b76a20'],yellow:['#ddd49a','#f1e8bd','#e8dda8','#352f16','#70663d','#c9bd78','#eadfaa','#a58a12'],green:['#b9cfbc','#dfebdf','#d0e2d1','#17321d','#536958','#9db8a0','#d2e4d3','#327d42'],blue:['#b4c9da','#dce9f3','#cedfea','#173047','#526a7c','#94b1c8','#d0e1ee','#246b9f'],purple:['#c9b9d2','#e5dbea','#d9ccdf','#30223a','#685a72','#aa96b6','#d9c9e0','#714394'],dark:['#0b0c0e','#1d1f23','#292c31','#f1f3f4','#a7aab0','#3b3e44','#30343b','#76a8ff']};
function theme(n){let t=themes[n]||themes.light,r=document.documentElement;['bg','surface','surface2','text','muted','border','accent','strong'].forEach((k,i)=>r.style.setProperty('--'+k,t[i]));localStorage.setItem(TKEY,n);document.querySelectorAll('.theme-option').forEach(x=>x.classList.toggle('selected',x.dataset.t==n))}function buildThemes(){let names=['Light','Red','Orange','Yellow','Green','Blue','Purple','Dark'],ids=Object.keys(themes);$('themeMenu').innerHTML=ids.map((id,i)=>'<button class="theme-option" data-t="'+id+'"><span class="swatches"><i class="swatch" style="background:'+themes[id][1]+'"></i><i class="swatch" style="background:'+themes[id][0]+'"></i></span><span class="theme-name">'+names[i]+'</span></button>').join('');document.querySelectorAll('.theme-option').forEach(b=>b.onclick=()=>{theme(b.dataset.t);$('themeMenu').classList.remove('open')})}
function save(){localStorage.setItem(KEY,JSON.stringify(s.lists))}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function modal(title,msg,bs){return new Promise(r=>{$('mt').textContent=title;$('mm').textContent=msg;$('ma').innerHTML='';bs.forEach(b=>{let x=document.createElement('button');x.className='text-btn '+(b.c||'');x.textContent=b.t;x.onclick=()=>{$('modal').classList.remove('open');r(b.v)};$('ma').appendChild(x)});$('modal').classList.add('open')})}function autosize(e){e.style.height='auto';e.style.height=Math.max(32,e.scrollHeight)+'px'}
function tasks(){return[...document.querySelectorAll('.task-row')].map(r=>({id:r.dataset.id,text:r.querySelector('textarea').value,done:r.querySelector('.check').classList.contains('checked')}))}function persistEdit(){if(!s.fromSaved||!s.id)return;let l=s.lists.find(x=>x.id===s.id);if(!l)return;l.name=$('name').value.trim()||'Untitled List';l.checklist=$('toggle').checked;l.tasks=tasks();l.updatedAt=Date.now();save()}
function renderTasks(ts){$('active').innerHTML='';$('completeRows').innerHTML='';let a=ts.filter(t=>!t.done),c=ts.filter(t=>t.done);a.forEach((t,i)=>row(t,false,i));c.forEach((t,i)=>row(t,true,i));modeUI();document.querySelectorAll('textarea').forEach(autosize)}function row(t,done,i){let r=document.createElement('div');r.className='task-row'+(!$('toggle').checked?' no-check':'');r.dataset.id=t.id;r.innerHTML='<div class="number">'+(done?'':i+1+'.')+'</div><textarea rows="1"></textarea><button class="check '+(done?'checked':'')+'">'+(done?'✓':'')+'</button>';let e=r.querySelector('textarea');e.value=t.text;e.oninput=()=>{autosize(e);persistEdit()};e.onkeydown=key;r.querySelector('.check').onclick=()=>{if(!$('toggle').checked)return;let z=tasks().map(x=>x.id==t.id?{...x,done:!x.done}:x);renderTasks(z);persistEdit()};let h=r.querySelector('.number');if(!done){h.draggable=true;h.ondragstart=x=>{x.dataTransfer.setData('id',t.id)};r.ondragover=x=>x.preventDefault();r.ondrop=x=>{x.preventDefault();let f=[...$('active').children].find(q=>q.dataset.id==x.dataTransfer.getData('id'));if(f){x.currentTarget===f||x.currentTarget.before(f);nums();persistEdit()}}}$((done?'completeRows':'active')).appendChild(r)}function nums(){document.querySelectorAll('#active .task-row').forEach((r,i)=>r.querySelector('.number').textContent=i+1+'.')}function modeUI(){let on=$('toggle').checked;document.querySelectorAll('.task-row').forEach(r=>{r.classList.toggle('no-check',!on);r.querySelector('.check').style.display=on?'flex':'none'});$('completed').style.display=on&&$('completeRows').children.length?'block':'none'}
function key(e){if(e.key==='Enter'){e.preventDefault();let r=e.target.closest('.task-row'),rs=[...$('active').children],i=rs.indexOf(r);if(!e.target.value.trim()){(rs[i+1]?.querySelector('textarea')||e.target).focus();return}let t={id:uid(),text:'',done:false};row(t,false,i+1);let n=[...$('active').children].find(x=>x.dataset.id==t.id);if(i+1<rs.length)rs[i+1].before(n);nums();n.querySelector('textarea').focus();persistEdit()}if((e.key==='Backspace'||e.key==='Delete')&&!e.target.value){e.preventDefault();let rs=[...$('active').children],r=e.target.closest('.task-row'),i=rs.indexOf(r);if(i>0){let p=rs[i-1].querySelector('textarea');r.remove();nums();persistEdit();requestAnimationFrame(()=>{p.focus();p.setSelectionRange(p.value.length,p.value.length)})}}}
function openNew(){s.id=null;s.fromSaved=false;$('editorTitle').textContent='New List';$('left').innerHTML=trash();$('left').classList.add('trash-btn');$('editorTrash').style.display='none';$('name').value='';$('toggle').checked=false;renderTasks([{id:uid(),text:'',done:false}]);show('editor');setTimeout(()=>$('active textarea')?.focus(),50)}function openEdit(id){let l=s.lists.find(x=>x.id==id&&!x.trashed);if(!l)return;s.id=id;s.fromSaved=true;$('editorTitle').textContent='Edit List';$('left').textContent='‹';$('left').classList.remove('trash-btn');$('editorTrash').style.display='inline-flex';$('name').value=l.name;$('toggle').checked=!!l.checklist;renderTasks(l.tasks);show('editor')}
function renderSaved(){let b=$('savedBox');b.innerHTML='';$('select').textContent=s.select?'Unselect':'Select';$('savedScreen').classList.toggle('selection-mode',s.select);$('savedScreen').classList.toggle('has-selection',s.selected.size>0);let aa=s.lists.filter(x=>!x.trashed),tt=s.lists.filter(x=>x.trashed);function card(l){let c=document.createElement('div');c.className='saved-card'+(l.trashed?' trashed':'')+(s.selected.has(l.id)?' selected':'');c.innerHTML='<div class="selection-check '+(s.selected.has(l.id)?'on':'')+'">'+(s.selected.has(l.id)?'✓':'')+'</div><div class="saved-main"><div class="saved-title">'+esc(l.name)+'</div><div class="saved-meta">'+l.tasks.length+' item'+(l.tasks.length==1?'':'s')+' · '+l.tasks.filter(x=>x.done).length+' completed</div></div>'+(l.trashed?'<button class="icon-btn restore">↶</button>':'<button class="icon-btn">›</button>');c.onclick=e=>{if(e.target.closest('.restore')){l.trashed=false;save();renderSaved();return}if(s.select){s.selected.has(l.id)?s.selected.delete(l.id):s.selected.add(l.id);renderSaved()}else openEdit(l.id)};return c}function put(a){let x=document.createElement('div');x.className='saved-list';a.forEach(l=>x.appendChild(card(l)));b.appendChild(x)}if(aa.length)put(aa);else b.innerHTML='<div class="saved-empty">No saved lists yet. Create your first list to see it here.</div>';if(tt.length){let h=document.createElement('div');h.className='saved-section-title';h.textContent='Trashed Lists';b.appendChild(h);put(tt)}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function delCurrent(){if(!s.fromSaved){let a=await modal('Discard this list?','This new list has not been saved yet. Discard it?',[{t:'Cancel',v:0},{t:'Discard',v:1,c:'danger-fill'}]);if(a)show('main');return}persistEdit();let a=await modal('Move list to Trash?','This list will be moved to Trashed Lists.',[{t:'Cancel',v:0},{t:'Trash',v:1,c:'danger-fill'}]);if(a){let l=s.lists.find(x=>x.id==s.id);if(l)l.trashed=true;save();show('savedScreen');renderSaved()}}async function delSelected(){if(!s.selected.size)return;let a=await modal('Move selected lists to Trash?','The selected lists will be moved to Trashed Lists.',[{t:'Cancel',v:0},{t:'Trash',v:1,c:'danger-fill'}]);if(a){s.lists.forEach(l=>{if(s.selected.has(l.id))l.trashed=true});s.selected.clear();s.select=false;save();renderSaved()}}
$('new').onclick=openNew;$('saved').onclick=()=>{s.select=false;s.selected.clear();show('savedScreen');renderSaved()};$('savedBack').onclick=()=>show('main');$('select').onclick=()=>{s.select=!s.select;if(!s.select)s.selected.clear();renderSaved()};$('savedTrash').onclick=delSelected;$('done').onclick=()=>{if(s.fromSaved)persistEdit();else{let l={id:uid(),name:$('name').value.trim()||'Untitled List',checklist:$('toggle').checked,tasks:tasks(),updatedAt:Date.now(),trashed:false};s.lists.unshift(l);s.id=l.id;save()}show(s.fromSaved?'savedScreen':'main');if(s.fromSaved)renderSaved()};$('left').onclick=()=>s.fromSaved?show('savedScreen'):delCurrent();$('editorTrash').onclick=delCurrent;$('name').oninput=persistEdit;$('toggle').onchange=()=>{renderTasks(tasks().map(t=>({...t,done:$('toggle').checked?t.done:false})));persistEdit()};
$('themeBtn').onclick=e=>{$('themeMenu').classList.toggle('open');e.stopPropagation()};document.onclick=e=>{if(!e.target.closest('.theme-wrap'))$('themeMenu').classList.remove('open')};buildThemes();theme(localStorage.getItem(TKEY)||'light');$('savedTrash').innerHTML=trash();$('editorTrash').innerHTML=trash();
</script></body></html>
